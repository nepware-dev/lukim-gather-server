fail_fast: true
repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff-lint
        entry: uv run ruff check .
        pass_filenames: false
        language: system
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format . --check
        pass_filenames: false
        language: system
