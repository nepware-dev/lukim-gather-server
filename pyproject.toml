[project]
name = "lukim-gather-server"
version = "0.1.0"
description = '"Lukim gather server"'
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.11,<4"
dependencies = [
    "Django>=3.2.18,<4",
    "environs[django]>=9.4.0,<10",
    "marshmallow>=3.14.1,<4",
    "psycopg2-binary>=2.9.3,<3",
    "graphene-django>=3.0.0b7,<4",
    "django-filter>=22.1,<23",
    "django-graphql-jwt>=0.3.4,<0.4",
    "celery>=5.2.3,<6",
    "redis>=4.5.4,<5",
    "django-modeltranslation>=0.17.5,<0.18",
    "django-ordered-model>=3.5.0,<4",
    "django-ckeditor>=6.2.0,<7",
    "django-mptt>=0.13.4,<0.14",
    "django-graphql-geojson>=0.1.4,<0.2",
    "graphene-file-upload>=1.3.0,<2",
    "sentry-sdk>=1.5.8,<2",
    "djangorestframework>=3.13.1,<4",
    "django-admin-autocomplete-filter>=0.7.1,<0.8",
    "djangorestframework-gis>=0.18,<0.19",
    "django-cors-headers>=3.11.0,<4",
    "pillow>=10.1.0,<11",
    "graphene-django-extras>=1.0.0,<2",
    "django-admin-interface>=0.19.0,<0.20",
    "django-json-widget>=1.1.1,<2",
    "django-oauth-toolkit>=2.0.0,<3",
    "django-allauth>=0.54.0,<0.55",
    "django-vectortiles>=0.1.0,<0.2",
    "boto3>=1.24.42,<2",
    "django-phonenumber-field[phonenumbers]>=6.3.0,<7",
    "watchtower>=3.0.0,<4",
    "django-ratelimit>=3.0.1,<4",
    "django-reversion>=5.0.3,<6",
    "django-push-notifications[WP, APNS]>=3.0.0,<4",
    "py3-validate-email>=1.0.5.post1,<2",
    "sorl-thumbnail>=12.10.0,<12.11.0",
]

[project.optional-dependencies]
asgi = [
    "uvicorn[standard]>=0.25.0,<0.26",
    "gunicorn>=22.0.0,<23",
]

[dependency-groups]
dev = [
    "black>=22.3.0,<23",
    "isort>=5.10.1,<6",
    "safety>=2.3.5,<3",
    "django-extensions>=3.1.5,<4",
    "pre-commit>=2.16.0,<3",
    "model-bakery>=1.4.0,<2",
    "werkzeug>=3.0.1,<4",
]

[tool.black]
extend-exclude = "migrations/"

[tool.isort]
skip_glob = ["__pycache__", "**/migrations"]
profile = "black"
